<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registry — Lisa &amp; Pete</title>
<meta name="description" content="Gift registries for Lisa &amp; Pete's wedding on November 7, 2026.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f6f3ea; color: #1d2433; font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #26493a; }
  a:hover { color: #b05f36; }

  header { border-bottom: 1px solid rgba(29,36,51,0.12); }
  .bar { max-width: 1160px; margin: 0 auto; padding: 14px 24px; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; letter-spacing: 0.04em; color: #1d2433; text-decoration: none; }
  .logo span { color: #b05f36; font-style: italic; }

  main { max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .eyebrow { text-align: center; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: #b05f36; margin-bottom: 14px; }
  h1 { margin: 0 0 20px; text-align: center; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(40px, 8vw, 60px); line-height: 1.05; }
  .intro { max-width: 520px; margin: 0 auto 48px; text-align: center; font-size: 16px; line-height: 1.65; color: rgba(29,36,51,0.72); }

  .registry { background: #26493a; border-radius: 6px; padding: 32px; }
  .registry h2 { margin: 0 0 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #a8c6dd; }
  .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .store { display: flex; align-items: center; justify-content: center; min-height: 84px; padding: 22px; background: #fff; border-radius: 4px; text-decoration: none; color: #1d2433; }
  .store:hover, .store:focus-visible { color: #1d2433; outline: 3px solid rgba(246,243,234,0.55); outline-offset: 2px; }
  .bloomingdales { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; }
  .crate { font-weight: 700; letter-spacing: 0.02em; font-size: 18px; text-transform: uppercase; }

  .thanks { margin: 40px 0 0; text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: rgba(29,36,51,0.6); }

  @media (max-width: 560px) {
    main { padding: 48px 16px 72px; }
    .bar { padding: 14px 16px; }
    .registry { padding: 24px 16px; }
    .stores { grid-template-columns: 1fr; gap: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="/" aria-label="Back to home">L <span>&amp;</span> P</a>
  </div>
</header>

<main>
  <div class="eyebrow">Registry</div>
  <h1>Gifts &amp; Registries</h1>
  <p class="intro">
    Your presence at our wedding is the greatest gift. If you'd like to get us
    something anyway, here are a few household items we may need (someday).
  </p>

  <section class="registry" aria-labelledby="reg-title">
    <h2 id="reg-title">Registry</h2>
    <div class="stores">
      <a class="store bloomingdales" href="https://www.bloomingdales.com/registry/Lisa-Stern-Peter-Fishman/1620668" target="_blank" rel="noopener">bloomingdale's</a>
      <a class="store crate" href="https://www.crateandbarrel.com/gift-registry/lisa-stern-and-peter-fishman/r7585325" target="_blank" rel="noopener">Crate&amp;Barrel</a>
    </div>
  </section>

  <p class="thanks">With love and gratitude, Lisa &amp; Pete</p>
</main>
</body>
</html>
